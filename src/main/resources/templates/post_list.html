<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>게시글 목록</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .post-link {
            text-decoration: none;
            color: #333;
            transition: color 0.3s;
        }
        .post-link:hover {
            color: #007bff;
        }
        .comment-count {
            background-color: #007bff;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
        }
        .pagination {
            margin-top: 2rem;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row mb-4">
            <div class="col">
                <h1 class="display-4 mb-4">게시글 목록</h1>
                <a th:href="@{/posts/new}" class="btn btn-primary mb-4">
                    <i class="bi bi-plus-circle"></i> 새 글 작성
                </a>
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>번호</th>
                                        <th>제목</th>
                                        <th class="text-center">댓글</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="post : ${posts}">
                                        <td th:text="${post.id}" class="align-middle" style="width: 10%"></td>
                                        <td class="align-middle" style="width: 70%">
                                            <a th:href="@{/posts/{id}(id=${post.id})}"
                                               th:text="${post.title}"
                                               class="post-link">제목</a>
                                        </td>
                                        <td class="text-center align-middle" style="width: 20%">
                                            <span class="comment-count" th:text="${post.commentCount}"></span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 페이징 -->
                        <nav th:if="${page.totalPages > 0}">
                            <ul class="pagination">
                                <!-- 이전 페이지 -->
                                <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                                    <a class="page-link" 
                                       th:href="@{/posts(page=${page.number - 1})}"
                                       th:unless="${!page.hasPrevious()}">&laquo;</a>
                                    <span class="page-link" th:if="${!page.hasPrevious()}">&laquo;</span>
                                </li>

                                <!-- 페이지 번호 -->
                                <li class="page-item" 
                                    th:each="pageNum : ${#numbers.sequence(0, page.totalPages - 1)}"
                                    th:classappend="${pageNum == page.number} ? 'active'">
                                    <a class="page-link" 
                                       th:href="@{/posts(page=${pageNum})}"
                                       th:text="${pageNum + 1}"></a>
                                </li>

                                <!-- 다음 페이지 -->
                                <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                                    <a class="page-link" 
                                       th:href="@{/posts(page=${page.number + 1})}"
                                       th:unless="${!page.hasNext()}">&raquo;</a>
                                    <span class="page-link" th:if="${!page.hasNext()}">&raquo;</span>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
