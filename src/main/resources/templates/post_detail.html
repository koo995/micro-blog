<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>게시글 상세</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .comment {
            border-bottom: 1px solid #eee;
            padding: 1rem 0;
        }
        .comment:last-child {
            border-bottom: none;
        }
        .btn-action {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h1 class="card-title h2" th:text="${postDetail.title}">제목</h1>
                <p class="text-muted">
                    <small th:text="${#temporals.format(postDetail.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
                </p>
                <p class="card-text" style="white-space: pre-line;" th:text="${postDetail.content}">내용</p>
                
                <div class="d-flex mt-4">
                    <form th:action="@{/posts/{id}/edit(id=${postDetail.id})}" method="get" class="me-2">
                        <button type="submit" class="btn btn-primary btn-sm">수정하기</button>
                    </form>
                    <form th:action="@{/posts/{id}/delete(id=${postDetail.id})}" method="post" class="me-2">
                        <button type="submit" class="btn btn-danger btn-sm">삭제하기</button>
                    </form>
                    <a th:href="@{/posts}" class="btn btn-secondary btn-sm">목록으로</a>
                </div>
            </div>
        </div>

        <!-- 댓글 섹션 -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h4 mb-4">댓글</h2>
                
                <!-- 댓글 작성 폼 -->
                <form th:action="@{/posts/{id}/comments(id=${postDetail.id})}" method="post" class="mb-4">
                    <div class="form-group">
                        <textarea name="content" class="form-control" rows="3" 
                                  placeholder="댓글을 입력하세요..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary mt-2">댓글 작성</button>
                </form>

                <!-- 댓글 목록 -->
                <div class="comments">
                    <div th:each="comment : ${postDetail.comments}" class="comment">
                        <p class="mb-1" th:text="${comment.content}">댓글내용</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted" 
                                   th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">
                            </small>
                            <form th:action="@{/posts/{postId}/comments/{commentId}/delete(postId=${postDetail.id}, commentId=${comment.id})}"
                                  method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
