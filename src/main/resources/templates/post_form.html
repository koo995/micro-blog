<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>게시글 작성/수정</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-message {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="card-title h2 mb-4">게시글 작성/수정</h1>

                        <!-- 새 글 작성 폼 -->
                        <form th:if="${post.id == null}"
                              th:action="@{/posts}"
                              th:object="${post}"
                              method="post"
                              class="needs-validation">
                            <div class="mb-3">
                                <label for="title" class="form-label">제목</label>
                                <input type="text" class="form-control" id="title" 
                                       th:field="*{title}"
                                       th:class="${#fields.hasErrors('title')} ? 'form-control is-invalid' : 'form-control'">
                                <div class="error-message" th:if="${#fields.hasErrors('title')}" 
                                     th:errors="*{title}">제목 오류</div>
                            </div>
                            <div class="mb-3">
                                <label for="content" class="form-label">내용</label>
                                <textarea class="form-control" id="content"
                                          th:field="*{content}"
                                          th:class="${#fields.hasErrors('content')} ? 'form-control is-invalid' : 'form-control'"
                                          rows="10"></textarea>
                                <div class="error-message" th:if="${#fields.hasErrors('content')}"
                                     th:errors="*{content}">내용 오류</div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary">작성</button>
                                <a th:href="@{/posts}" class="btn btn-secondary">목록으로</a>
                            </div>
                        </form>

                        <!-- 글 수정 폼 -->
                        <form th:if="${post.id != null}"
                              th:action="@{/posts/{id}/edit(id=${post.id})}"
                              th:object="${post}"
                              method="post"
                              class="needs-validation">
                            <div class="mb-3">
                                <label for="editTitle" class="form-label">제목</label>
                                <input type="text" class="form-control" id="editTitle"
                                       th:field="*{title}"
                                       th:class="${#fields.hasErrors('title')} ? 'form-control is-invalid' : 'form-control'">
                                <div class="error-message" th:if="${#fields.hasErrors('title')}"
                                     th:errors="*{title}">제목 오류</div>
                            </div>
                            <div class="mb-3">
                                <label for="editContent" class="form-label">내용</label>
                                <textarea class="form-control" id="editContent"
                                          th:field="*{content}"
                                          th:class="${#fields.hasErrors('content')} ? 'form-control is-invalid' : 'form-control'"
                                          rows="10"></textarea>
                                <div class="error-message" th:if="${#fields.hasErrors('content')}"
                                     th:errors="*{content}">내용 오류</div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary">수정</button>
                                <a th:href="@{/posts}" class="btn btn-secondary">목록으로</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
